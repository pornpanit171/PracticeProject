<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>CISSP — Practice Bank</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>&#127919;</text></svg>">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <div id="syncBadge" class="sync-badge" hidden></div>
    <div class="spacer"></div>
    <button type="button" id="btnSignOut" class="linkish" hidden></button>
    <div class="lang-toggle" role="group" aria-label="Language">
      <button type="button" class="lang-btn" data-lang="en">EN</button>
      <button type="button" class="lang-btn" data-lang="th">TH</button>
      <button type="button" class="lang-btn" data-lang="both">EN+TH</button>
    </div>
  </div>
</header>

<main id="app">

  <!-- ══════════ ประตูรหัส ══════════ -->
  <section id="screen-gate" class="screen" hidden>
    <div class="card narrow">
      <p class="eyebrow" id="gateCreatedBy"></p>
      <h1 id="gateTitle"></h1>
      <p class="lede" id="gateHint"></p>

      <form id="gateForm" autocomplete="off">
        <input type="text" id="gateCode" class="input mono" spellcheck="false" autocapitalize="characters">
        <label class="check-inline">
          <input type="checkbox" id="gateRemember" checked>
          <span id="gateRememberLabel"></span>
        </label>
        <p class="error" id="gateError" hidden></p>
        <button type="submit" class="btn-primary" id="gateSubmit"></button>
      </form>
    </div>
  </section>

  <!-- ══════════ หน้าตั้งค่าก่อนเริ่ม ══════════ -->
  <section id="screen-setup" class="screen" hidden>
    <div class="card">
      <p class="eyebrow" id="setupCreatedBy"></p>
      <h1 id="setupTitle"></h1>
      <p class="lede" id="setupSubtitle"></p>

      <div id="resumeBox" class="resume-box" hidden>
        <p id="resumeText"></p>
        <div class="row gap">
          <button type="button" class="btn-small primary" id="btnResumeYes"></button>
          <button type="button" class="btn-small" id="btnResumeNo"></button>
        </div>
      </div>

      <label class="field-label" for="playerName" id="labelName"></label>
      <input type="text" id="playerName" class="input" autocomplete="name">
      <p class="hint" id="nameLockedHint" hidden></p>

      <p class="group-label" id="labelMode"></p>
      <div class="option-grid" id="modeGroup">
        <button type="button" class="option" data-value="practice">
          <span class="option-title" data-i18n-title="practice"></span>
          <span class="option-hint" data-i18n-hint="practiceHint"></span>
        </button>
        <button type="button" class="option" data-value="exam">
          <span class="option-title" data-i18n-title="exam"></span>
          <span class="option-hint" data-i18n-hint="examHint"></span>
        </button>
      </div>
      <p class="note" id="modeNote"></p>

      <p class="group-label" id="labelOrder"></p>
      <div class="option-grid" id="orderGroup">
        <button type="button" class="option" data-value="sequential">
          <span class="option-title" data-i18n-title="sequential"></span>
          <span class="option-hint" data-i18n-hint="sequentialHint"></span>
        </button>
        <button type="button" class="option" data-value="random">
          <span class="option-title" data-i18n-title="random"></span>
          <span class="option-hint" data-i18n-hint="randomHint"></span>
        </button>
      </div>

      <p class="group-label" id="labelReveal"></p>
      <div class="option-grid" id="revealGroup">
        <button type="button" class="option" data-value="instant">
          <span class="option-title" data-i18n-title="revealInstant"></span>
          <span class="option-hint" data-i18n-hint="revealInstantHint"></span>
        </button>
        <button type="button" class="option" data-value="end">
          <span class="option-title" data-i18n-title="revealEnd"></span>
          <span class="option-hint" data-i18n-hint="revealEndHint"></span>
        </button>
      </div>
      <p class="note" id="revealNote" hidden></p>

      <p class="group-label" id="labelDomains"></p>
      <div id="domainList" class="domain-list"></div>
      <p class="row gap small">
        <button type="button" class="linkish" id="btnSelectAll"></button>
        <button type="button" class="linkish" id="btnClearAll"></button>
      </p>

      <div class="row between wrap count-row">
        <label class="field-label inline" for="questionCount" id="labelCount"></label>
        <input type="number" id="questionCount" class="input tiny" min="1" step="1">
      </div>
      <p class="hint" id="availableText"></p>

      <button type="button" class="btn-primary big" id="btnStart"></button>
      <p class="error center" id="startError" hidden></p>

      <p class="center gap-top">
        <button type="button" class="linkish" id="btnHistory"></button>
      </p>
    </div>
  </section>

  <!-- ══════════ หน้าทำข้อสอบ ══════════ -->
  <section id="screen-quiz" class="screen wide" hidden>
    <div class="timer-bar">
      <div class="timer" id="timer"><span class="timer-icon">◷</span><span id="timerText">--:--</span></div>
      <button type="button" class="btn-ghost" id="btnFinishNow"></button>
    </div>

    <div class="progress-head">
      <span class="mono" id="progressCount"></span>
      <span class="tally" id="tally"></span>
    </div>
    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>

    <article class="card question-card">
      <div class="row between top">
        <span class="domain-chip" id="domainChip"></span>
        <button type="button" class="flag-btn" id="btnFlag" title="Flag"></button>
      </div>
      <p class="eyebrow" id="questionNo"></p>
      <div id="questionText"></div>
      <p class="hint" id="multiHint" hidden></p>

      <div id="choices" class="choices"></div>

      <button type="button" class="btn-primary" id="btnSubmitAnswer" hidden></button>

      <div id="explainBox" class="explain" hidden>
        <p class="explain-label" id="explainLabel"></p>
        <div id="explainText"></div>
      </div>

      <div class="row end gap-top">
        <button type="button" class="btn-primary" id="btnNext" hidden></button>
      </div>
    </article>
  </section>

  <!-- ══════════ หน้าผลสรุป ══════════ -->
  <section id="screen-result" class="screen" hidden>
    <div class="card">
      <p class="eyebrow" id="resultEyebrow"></p>
      <div class="score-hero">
        <div class="score-pct" id="scorePct"></div>
        <div class="score-verdict" id="scoreVerdict"></div>
      </div>

      <div class="stat-row" id="statRow"></div>

      <p class="group-label" id="labelByDomain"></p>
      <div id="domainBreakdown" class="breakdown"></div>

      <div class="row gap wrap gap-top">
        <button type="button" class="btn-primary" id="btnReview"></button>
        <button type="button" class="btn-ghost" id="btnRetryWrong"></button>
        <button type="button" class="btn-ghost" id="btnNewQuiz"></button>
        <button type="button" class="btn-ghost" id="btnExportResult"></button>
      </div>
    </div>
  </section>

  <!-- ══════════ หน้าเฉลยรายข้อ ══════════ -->
  <section id="screen-review" class="screen wide" hidden>
    <div class="row between wrap head-row">
      <button type="button" class="linkish" id="btnReviewBack"></button>
      <h2 id="reviewTitle"></h2>
      <div class="filter-group" id="reviewFilter">
        <button type="button" class="filter-btn active" data-filter="all"></button>
        <button type="button" class="filter-btn" data-filter="wrong"></button>
        <button type="button" class="filter-btn" data-filter="flagged"></button>
      </div>
    </div>
    <div id="reviewList"></div>
  </section>

  <!-- ══════════ หน้าประวัติ ══════════ -->
  <section id="screen-history" class="screen wide" hidden>
    <div class="row between wrap head-row">
      <button type="button" class="linkish" id="btnHistoryBack"></button>
      <h2 id="historyTitle"></h2>
      <div class="row gap">
        <label class="check-inline"><input type="checkbox" id="historyAllNames"><span id="historyAllLabel"></span></label>
        <button type="button" class="linkish" id="btnHistoryRefresh"></button>
        <button type="button" class="linkish" id="btnHistoryExport"></button>
      </div>
    </div>
    <div id="historyBody"></div>
  </section>

  <!-- ══════════ กำลังโหลด / ข้อผิดพลาด ══════════ -->
  <section id="screen-loading" class="screen" hidden>
    <div class="card narrow center-block">
      <p class="lede" id="loadingText"></p>
    </div>
  </section>

  <section id="screen-error" class="screen" hidden>
    <div class="card narrow">
      <h1 id="errorTitle"></h1>
      <p class="lede mono" id="errorDetail"></p>
      <button type="button" class="btn-primary" id="btnErrorRetry"></button>
    </div>
  </section>

</main>

<script src="assets/config.js"></script>
<script src="assets/i18n.js"></script>
<script src="assets/storage.js"></script>
<script src="assets/auth.js"></script>
<script src="assets/bank.js"></script>
<script src="assets/sheets.js"></script>
<script src="assets/quiz.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
